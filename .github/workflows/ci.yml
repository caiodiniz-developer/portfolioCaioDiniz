name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same flag Vercel uses: R3F's peer ranges lag behind React 19.
      - run: npm ci --legacy-peer-deps
      # tsc -b (src, api, vite config) then vite build + the SEO plugin.
      - run: npm run build
